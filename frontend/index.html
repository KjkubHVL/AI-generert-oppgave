<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MatteHjelpen</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f3f6fb;
        margin: 0;
        padding: 2rem;
        color: #1f2937;
      }
      .container {
        max-width: 980px;
        margin: 0 auto;
        background: white;
        border-radius: 16px;
        padding: 2rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
      }
      textarea {
        width: 100%;
        min-height: 160px;
        padding: 1rem;
        font-size: 1rem;
        border-radius: 10px;
        border: 1px solid #d1d5db;
        box-sizing: border-box;
      }
      button {
        margin-top: 1rem;
        background: #2563eb;
        color: white;
        border: none;
        padding: 0.8rem 1.4rem;
        border-radius: 999px;
        font-size: 1rem;
        cursor: pointer;
      }
      .status {
        margin-top: 1rem;
        font-weight: 700;
      }
      .ok { color: #15803d; }
      .bad { color: #b91c1c; }
      .section {
        margin-top: 1.5rem;
      }
      .step {
        background: #f8fafc;
        border-left: 4px solid #60a5fa;
        padding: 0.9rem;
        margin-bottom: 0.7rem;
        border-radius: 8px;
      }
      ul {
        padding-left: 1.3rem;
      }
      .formula-list li {
        margin-bottom: 0.4rem;
      }
      .meta {
        color: #475569;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>MatteHjelpen</h1>
      <textarea id="oppgave" placeholder="Skriv inn en matteoppgave, for eksempel: Deriver f(x)=x^2+3x+1"></textarea>
      <button onclick="solveTask()">Løs</button>

      <div id="status" class="status"></div>
      <div id="result"></div>
    </div>

    <script>
      async function solveTask() {
        const oppgave = document.getElementById('oppgave').value;
        const statusEl = document.getElementById('status');
        const resultEl = document.getElementById('result');
        statusEl.textContent = 'Løser...';
        statusEl.className = 'status';

        try {
          const response = await fetch('/solve', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ oppgave })
          });

          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || 'Kunne ikke løse oppgaven');

          const valid = !!data.validert;
          statusEl.textContent = valid ? 'Validering: OK' : 'Validering: Feilet/ukjent';
          statusEl.className = `status ${valid ? 'ok' : 'bad'}`;

          const steps = (data.steg || []).map(step => `<div class="step">${step}</div>`).join('');
          const formulas = (data.formler_brukt || []).map(f => `<li><strong>${f.id}</strong>: ${f.navn} — ${f.referanse}</li>`).join('');

          resultEl.innerHTML = `
            <div class="section">
              <h2>Svar</h2>
              <div>${data.svar || 'Ingen svar'}</div>
            </div>

            <div class="section">
              <h3>Stegvis løsning</h3>
              ${steps || '<div class="step">Ingen steg tilgjengelig.</div>'}
            </div>

            <div class="section">
              <h3>Formler brukt</h3>
              <ul class="formula-list">${formulas || '<li>Ingen formelreferanser registrert.</li>'}</ul>
            </div>

            <div class="meta">
              <p>Verifisert av verktøy: ${data.verifisert_av_verktoy ? 'Ja' : 'Nei'}</p>
              <p>Valideringsstatus: ${JSON.stringify(data.validering || {})}</p>
              <p>Tokens brukt: ${data.tokens_brukt ?? 0}</p>
              <p>Estimert kostnad: ${data.estimert_kostnad ?? 0}</p>
            </div>
          `;

          if (window.MathJax) {
            MathJax.typesetPromise();
          }
        } catch (error) {
          statusEl.textContent = 'Feilet ved løsing.';
          statusEl.className = 'status bad';
          resultEl.innerHTML = `<p>${error.message}</p>`;
        }
      }
    </script>
  </body>
</html>
